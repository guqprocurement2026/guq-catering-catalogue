<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GU-Q Catalogue Connection Test</title><style>body{font-family:system-ui;background:#f6f4ef;color:#17202a;margin:0}.wrap{max-width:760px;margin:60px auto;padding:24px}.card{background:#fff;border:1px solid #e3ded4;border-radius:20px;padding:28px;box-shadow:0 14px 40px rgba(7,27,51,.08)}h1{color:#071b33}.status{font-size:20px;font-weight:800;padding:16px;border-radius:12px;background:#f3f4f6}.ok{background:#e9f6ef;color:#17613f}.bad{background:#fff0f0;color:#9b2226}code{background:#f2f4f6;padding:2px 6px;border-radius:5px}.small{color:#6b7280;line-height:1.6}a{color:#071b33;font-weight:700}</style></head><body><div class="wrap"><div class="card"><h1>Catalogue connection test</h1><p class="small">This checks the only connection the website needs: <code>index.html → catalogue.json</code> in the same GitHub Pages root.</p><div id="status" class="status">Testing…</div><div id="details" class="small"></div><p><a href="index.html">← Back to catalogue</a></p></div></div><script>fetch('catalogue.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{if(!Array.isArray(d.hotels))throw new Error('JSON exists but does not contain a hotels array');document.getElementById('status').className='status ok';document.getElementById('status').textContent='✓ CONNECTION WORKING';document.getElementById('details').innerHTML='<p>Hotels loaded: <b>'+d.hotels.length+'</b></p><p>Last backend sync: <b>'+(d.generated_at||'Initial seed / not yet synced')+'</b></p><p>The browser is not connecting to Google Sheets directly. Finance Apps Script updates this JSON file in GitHub.</p>'}).catch(e=>{document.getElementById('status').className='status bad';document.getElementById('status').textContent='✕ CONNECTION FAILED';document.getElementById('details').innerHTML='<p><b>'+e.message+'</b></p><p>Confirm that <code>catalogue.json</code> is in the same GitHub repository root as <code>index.html</code>, and Pages is publishing <b>main / (root)</b>.</p>'})</script></body></html>
